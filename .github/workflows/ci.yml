name: CI

# Runs on every push and pull request. The point of this pipeline is that the
# three things which silently broke during development cannot break again
# unnoticed:
#
#   1. Migrations that do not apply from empty, or that drift from the models.
#      Twice during this project a schema change landed in the models without a
#      migration; both times it was caught by hand, long after the fact.
#   2. A test suite that reports success while the database is unreachable.
#      With PostgreSQL down, pytest printed "119 passed, 200 skipped" -- which
#      reads like partial success and is actually total test-infrastructure
#      failure. The skip-guard step below turns that into a hard error.
#   3. Silent coverage decay.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  backend:
    name: Backend tests, migrations and coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sih26122_ci
        ports: ["5432:5432"]
        # Without a health check the first migration races the server's startup
        # and fails with "connection refused" on a cold runner.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key-not-used-in-any-real-deployment
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sih26122_ci
      REDIS_URL: redis://localhost:6379/0
      # RATE_LIMIT_ENABLED is deliberately NOT set here. Forcing the limiter on
      # for the whole run throttles the suite's own traffic -- every test logs
      # in from the same client with no pause -- and was measured to break 30+
      # unrelated tests with 429 where they assert 401. The limiter is covered
      # per-test by the `limiter_on` fixture in tests/test_hardening.py, which
      # is the correct scope for it.

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assert a single migration head
        # A split head means two migrations claim the same parent. The app still
        # starts, `alembic upgrade head` then fails with an ambiguity error, and
        # the cause is usually a merge that nobody noticed.
        run: |
          heads=$(alembic heads | grep -c '(head)' || true)
          echo "migration heads: $heads"
          alembic heads
          if [ "$heads" -ne 1 ]; then
            echo "::error::expected exactly 1 migration head, found $heads"
            exit 1
          fi

      - name: Apply migrations from an empty database
        # Proves the migration chain works from scratch, not just that the
        # models can create tables.
        run: alembic upgrade head

      - name: Assert zero schema drift
        # If autogenerate finds anything, a model change shipped without a
        # migration. Compares the freshly-migrated database against the models.
        run: |
          alembic revision --autogenerate -m ci_drift_probe >/dev/null
          probe=$(ls -t alembic/versions/*ci_drift_probe*.py | head -1)
          if grep -qE '^\s+op\.' "$probe"; then
            echo "::error::schema drift detected -- a model change has no migration"
            echo "--- drift ---"
            sed -n '/def upgrade/,/end Alembic/p' "$probe"
            rm -f "$probe"
            exit 1
          fi
          echo "no drift"
          rm -f "$probe"

      - name: Run the test suite with coverage
        # Used to deselect tests/api/test_integrations_vapi.py::test_vapi_tool_call
        # here -- Phase 9/10 finding 10 (vapi.py read message.toolWithToolCallList
        # while its own test sent message.toolCalls) -- with a follow-up
        # informational step to keep the failure visible on the dashboard.
        # Your friend's audit-fix commit resolved it upstream; verified locally
        # with a clean run, so both are gone and this step is a normal gate again.
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml \
            -p no:randomly \
            -q | tee pytest-output.txt

      - name: Fail if tests were skipped wholesale
        # The failure mode this exists for: an unreachable database makes the
        # fixtures skip rather than error, and the run looks like a pass. A
        # handful of skips is normal; hundreds means nothing was really tested.
        run: |
          skipped=$(grep -oE '[0-9]+ skipped' pytest-output.txt | grep -oE '[0-9]+' | head -1 || echo 0)
          skipped=${skipped:-0}
          echo "skipped: $skipped"
          if [ "$skipped" -gt 20 ]; then
            echo "::error::$skipped tests skipped -- the test database was probably unreachable"
            exit 1
          fi

      - name: Enforce the coverage floor
        # Set just below the measured 90% so ordinary churn does not trip it,
        # while a real drop does. Raise it when coverage rises; never lower it
        # to make a red build green.
        run: python -m coverage report --fail-under=85

      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/coverage.xml
            backend/junit.xml
            backend/pytest-output.txt
          retention-days: 14

  static-checks:
    name: Import and configuration sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Every module imports cleanly
        # Catches a circular import or a syntax error in a module that no test
        # happens to touch, without needing a database.
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key-not-used-in-any-real-deployment
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import app

          failed = []
          for module in pkgutil.walk_packages(app.__path__, prefix="app."):
              try:
                  importlib.import_module(module.name)
              except Exception as exc:
                  failed.append((module.name, repr(exc)))

          for name, error in failed:
              print(f"FAILED {name}: {error}")
          sys.exit(1 if failed else 0)
          PY

      - name: No secret placeholder committed in .env.example
        # .env.example is the contract for deployment and must never carry a
        # real value. Cheap to check, expensive to get wrong.
        run: |
          if grep -qE '^(SECRET_KEY|META_APP_SECRET|META_ACCESS_TOKEN|VAPI_SECRET|VAPI_API_KEY)=.+' .env.example; then
            echo "::error::.env.example contains a non-empty secret value"
            grep -nE '^(SECRET_KEY|META_APP_SECRET|META_ACCESS_TOKEN|VAPI_SECRET|VAPI_API_KEY)=.+' .env.example
            exit 1
          fi
          echo ".env.example carries no secret values"
